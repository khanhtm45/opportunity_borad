<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <linearGradient id="obGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2BA2F4"/>
      <stop offset="45%" stop-color="#0388ED"/>
      <stop offset="75%" stop-color="#0759A0"/>
      <stop offset="100%" stop-color="#F69022"/>
    </linearGradient>
    <radialGradient id="obGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7DD3FC" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7DD3FC" stop-opacity="0"/>
    </radialGradient>
    <filter id="obBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- soft glow halo -->
  <circle cx="200" cy="200" r="170" fill="url(#obGlow)" filter="url(#obBlur)"/>

  <!-- decorative orbiting dots -->
  <g fill="url(#obGrad)">
    <circle cx="60" cy="120" r="5"/>
    <circle cx="340" cy="90" r="7"/>
    <circle cx="320" cy="300" r="5"/>
    <circle cx="80" cy="320" r="6"/>
    <circle cx="200" cy="40" r="4"/>
    <circle cx="370" cy="200" r="4"/>
  </g>

  <!-- OB monogram: infinity-like O merged with B -->
  <g stroke="url(#obGrad)" stroke-width="26" stroke-linecap="round" fill="none">
    <!-- O as a rounded infinity loop -->
    <path d="M150 200
             a55 55 0 1 1 -38 52
             a42 42 0 1 0 38 -52
             a42 42 0 1 0 -38 52
             a55 55 0 1 1 38 -52 Z"/>
    <!-- B stem + bowls -->
    <path d="M205 130 L205 270"/>
    <path d="M205 130 a45 45 0 0 1 0 70"/>
    <path d="M205 200 a45 45 0 0 1 0 70"/>
  </g>
</svg>

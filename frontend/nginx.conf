server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin API for custom domain (ob.khanhtn45.id.vn → BE)
    # Host replaced at container start from API_PROXY_HOST
    location /api/ {
        proxy_pass https://API_PROXY_HOST_PLACEHOLDER/api/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host API_PROXY_HOST_PLACEHOLDER;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_request_headers on;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}

# Test profile — KHÔNG dùng Supabase production.
# Datasource được AbstractIntegrationTest ghi đè bằng Testcontainers PostgreSQL.
# Mỗi lần push/CI trước đây TRUNCATE DB thật → mất seed demo; đã tách hẳn.
spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:1/disabled-use-testcontainers
    username: test
    password: test
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  mail:
    host: localhost
    port: 25

app:
  jwt:
    secret: ${JWT_SECRET:test-secret-test-secret-test-secret-test-secret!!}
    expiration-ms: 900000
    refresh-ms: 1209600000
  openrouter:
    api-key: ${OPENROUTER_API_KEY:}
    base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
    model: ${OPENROUTER_MODEL:google/gemini-3-flash-preview}
    site-url: https://example.com
    site-name: Opportunity Board Test
    timeout-seconds: 30
  s3:
    enabled: ""

logging:
  level:
    com.opportunityboard: WARN
    org.springframework: WARN
    org.testcontainers: INFO

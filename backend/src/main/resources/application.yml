server:
  # DigitalOcean App Platform injects PORT; local default 8080
  port: ${PORT:8080}

spring:
  application:
    name: opportunity-board-backend
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:10MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:12MB}
  datasource:
    url: ${DB_URL:jdbc:postgresql://aws-0-ap-northeast-1.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0&preparedStatementCacheSize=0&defaultRowFetchSize=50&stringtype=unspecified}
    username: ${DB_USERNAME:postgres.cmmypmpxisysrnqoqfdv}
    password: ${DB_PASSWORD:KhanhMinh0@}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate   # schema đã tạo trên Supabase; Flyway quản lý
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    # Schema đã tạo thủ công trên Supabase PostgreSQL 17 (Flyway 10.10 chưa hỗ trợ PG17).
    # Quản lý schema bằng docs/db/schema.sql. Tắt auto-run để tránh lỗi "Unsupported Database".
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
  mail:
    host: ${MAIL_HOST:smtp.example.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-32bytes-min!!}
    expiration-ms: 900000        # 15 phút
    refresh-ms: 1209600000        # 14 ngày
  openrouter:
    api-key: ${OPENROUTER_API_KEY:}
    base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
    model: ${OPENROUTER_MODEL:google/gemini-3-flash-preview}
    site-url: ${OPENROUTER_SITE_URL:https://github.com/khanhtm45/opportunity_borad}
    site-name: ${OPENROUTER_SITE_NAME:Opportunity Board}
    timeout-seconds: ${OPENROUTER_TIMEOUT_SECONDS:90}
  s3:
    # Bật khi UPLOAD_STORAGE=s3 và đủ AWS keys (xem backend/.env)
    enabled: ${UPLOAD_STORAGE:}
    bucket: ${S3_BUCKET:}
    region: ${S3_REGION:ap-southeast-2}
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}
    public-base-url: ${S3_PUBLIC_BASE_URL:}
  media:
    # Base tuyệt đối cho /media/view (VD: https://xxx.ondigitalocean.app/api/v1). Local để trống → /api/v1
    public-base-url: ${MEDIA_PUBLIC_BASE_URL:}


# Swagger UI — local: http://localhost:8080/api/swagger-ui.html
# DO (route /api): https://oyster-app-eleoo.ondigitalocean.app/api/swagger-ui.html
springdoc:
  api-docs:
    path: /api/v3/api-docs
  swagger-ui:
    path: /api/swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    try-it-out-enabled: true
  show-actuator: false
  # Optional absolute server URL in OpenAPI (để Try it out đúng host trên DO)
  server-url: ${SPRINGDOC_SERVER_URL:}
  packages-to-scan: com.opportunityboard.interface_http.controller
  paths-to-match: /api/v1/**

logging:
  level:
    com.opportunityboard: INFO

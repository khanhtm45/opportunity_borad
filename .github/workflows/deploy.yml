# Deploy:
# - FE → GitHub Pages (https://khanhtm45.github.io/opportunity_borad/)
# - BE → GitHub Releases (fat JAR) + DigitalOcean (2 apps riêng, xem .do/)
#     BE: .do/app-api.yaml      → oyster-app-eleoo
#     FE: .do/app-frontend.yaml → shark-app-epimy
#
# Setup:
# - DO API app: source backend/, secrets JWT_SECRET + DB_PASSWORD
# - DO FE app: source frontend/, BUILD_TIME VITE_BASE_PATH=/ + VITE_API_URL=…/api/v1
# - GitHub Variables → VITE_API_URL = https://oyster-app-eleoo.ondigitalocean.app/api/v1
# - Pages: configure-pages enablement=true

name: Deploy — Pages + Releases

on:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy-frontend:
    name: Deploy Frontend (GitHub Pages)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install & build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          npm ci
          npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Tự bật GitHub Pages (Source = GitHub Actions) nếu chưa cấu hình
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release-backend:
    name: Release Backend (JAR)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Package (skip tests — covered by ci.yml)
        working-directory: backend
        run: mvn -B -DskipTests package

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: backend-${{ github.run_number }}
          name: Backend build #${{ github.run_number }}
          files: backend/target/opportunity-board-backend-*.jar
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

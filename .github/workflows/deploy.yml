# Deploy:
# - FE → GitHub Pages (https://khanhtm45.github.io/opportunity_borad/)
# - BE → GitHub Releases (fat JAR mỗi lần push main)
#
# Setup một lần:
# 1. Settings → Pages → Source = GitHub Actions
# 2. Settings → Secrets and variables → Actions → Variables:
#    VITE_API_URL = https://your-api.example.com/api/v1
#    (khi BE đã chạy đâu đó; Releases chỉ upload JAR, không host server)

name: Deploy — Pages + Releases

on:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy-frontend:
    name: Deploy Frontend (GitHub Pages)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install & build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          npm ci
          npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release-backend:
    name: Release Backend (JAR)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Package (skip tests — covered by ci.yml)
        working-directory: backend
        run: mvn -B -DskipTests package

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: backend-${{ github.run_number }}
          name: Backend build #${{ github.run_number }}
          files: backend/target/opportunity-board-backend-*.jar
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

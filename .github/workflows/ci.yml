name: CI — Build, Test, SonarCloud & Auto-merge

on:
  push:
    branches: [main, ci/setup-pipeline]
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  backend-test:
    name: Backend (Maven + Testcontainers + JaCoCo)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build & run tests
        working-directory: backend
        run: mvn -B verify
      - name: SonarCloud scan
        if: ${{ secrets.SONAR_TOKEN != '' }}
        working-directory: backend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn -B sonar:sonar -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }} -Dsonar.organization=${{ secrets.SONAR_ORG }} -Dsonar.host.url=https://sonarcloud.io
      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/

  frontend-build:
    name: Frontend (Vite build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build

  auto-merge:
    name: Auto-create PR & merge into main
    needs: [backend-test, frontend-build]
    if: github.ref == 'refs/heads/ci/setup-pipeline' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create PR and enable auto-merge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create --base main --head ci/setup-pipeline --title "CI: pipeline tests + SonarCloud scan" --body "Auto CI setup" 2>/dev/null || echo "PR exists"
          gh pr merge ci/setup-pipeline --auto --squash --delete-branch

name: ci-min
on:
  push:
    branches: [main, ci/setup-pipeline]
  pull_request:
    branches: [main]
permissions:
  contents: write
  pull-requests: write
jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build & run tests
        working-directory: backend
        run: mvn -B verify
      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - run: echo "frontend placeholder"
  auto-merge:
    needs: [backend-test, frontend-build]
    if: github.ref == 'refs/heads/ci/setup-pipeline' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - run: echo "auto-merge placeholder"

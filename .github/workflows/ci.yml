name: CI — Build, Test & Auto-merge

on:
  push:
    branches: [main, ci/setup-pipeline]
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  backend-test:
    name: Backend (Maven + JaCoCo)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build & run tests
        working-directory: backend
        run: mvn -B verify
      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/

  frontend-build:
    name: Frontend (Vite build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build
  auto-merge:
    name: Auto-create PR & merge into main
    needs: [backend-test, frontend-build]
    # Chỉ kích hoạt khi push lên nhánh ci/setup-pipeline
    if: github.ref == 'refs/heads/ci/setup-pipeline' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create PR and merge into main via API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          API="https://api.github.com/repos/khanhtm45/opportunity_borad"
          # 1. Tạo PR (bắt lỗi rõ ràng)
          echo "Creating PR..."
          BODY=$(jq -n --arg t "CI: tests + auto-merge" --arg b "Tự động thiết lập CI: backend Maven verify, frontend Vite build, auto-merge vào main khi xanh." \
            '{head:"ci/setup-pipeline", base:"main", title:$t, body:$b}')
          RESP=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$API/pulls" -d "$BODY")
          HTTP=$(echo "$RESP" | tail -1)
          PR_JSON=$(echo "$RESP" | sed '$d')
          PR_NUM=$(echo "$PR_JSON" | jq -r '.number // empty')
          if [ -z "$PR_NUM" ]; then
            echo "PR CREATE FAILED (HTTP $HTTP):"; echo "$PR_JSON"; exit 1
          fi
          echo "PR #$PR_NUM created (HTTP $HTTP)"

          # 2. Merge (main không protect nên GITHUB_TOKEN merge được)
          echo "Merging PR #$PR_NUM into main..."
          MRESP=$(curl -s -w "\n%{http_code}" -X PUT \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$API/pulls/$PR_NUM/merge" -d '{"merge_method":"squash"}')
          MHTTP=$(echo "$MRESP" | tail -1)
          echo "Merge HTTP $MHTTP"
          echo "$MRESP" | sed '$d'
          if [ "$MHTTP" != "200" ]; then echo "MERGE FAILED"; exit 1; fi

          # 3. Xóa nhánh ci/setup-pipeline
          curl -s -X DELETE -H "Authorization: Bearer $GITHUB_TOKEN" \
            "$API/git/refs/heads/ci/setup-pipeline" && echo "Branch deleted" || echo "Branch delete skipped"

# DigitalOcean App Platform — BE + FE (cùng repo, cùng branch main)
#
# Cách khuyến nghị (ổn định nhất): FE dùng Dockerfile (nginx)
# - Component frontend: Dockerfile path = frontend/Dockerfile
# - HTTP port = 8080
# - Build-time env:
#     VITE_BASE_PATH=/
#     VITE_API_URL=https://<your-api-component>.ondigitalocean.app/api/v1
#
# Không dùng ${api.PUBLIC_URL} nếu FE và API là 2 App riêng — binding sẽ fail.

name: opportunity-board
region: sgp

services:
  - name: api
    github:
      repo: khanhtm45/opportunity_borad
      branch: main
      deploy_on_push: true
    dockerfile_path: backend/Dockerfile
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    routes:
      - path: /api
    health_check:
      http_path: /api/v1/categories
      initial_delay_seconds: 60
      period_seconds: 20
      timeout_seconds: 10
      success_threshold: 1
      failure_threshold: 6
    envs:
      - key: PORT
        scope: RUN_TIME
        value: "8080"
      - key: DB_PASSWORD
        scope: RUN_TIME
        type: SECRET
        value: SET_IN_DIGITALOCEAN_UI
      - key: JWT_SECRET
        scope: RUN_TIME
        type: SECRET
        value: CHANGE_ME_SET_IN_DO_UI_32chars_min!!

  - name: frontend
    github:
      repo: khanhtm45/opportunity_borad
      branch: main
      deploy_on_push: true
    dockerfile_path: frontend/Dockerfile
    source_dir: frontend
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    routes:
      - path: /
    envs:
      - key: VITE_BASE_PATH
        scope: BUILD_TIME
        value: "/"
      - key: VITE_API_URL
        scope: BUILD_TIME
        # Điền URL API thật trên UI DO (không dùng binding nếu App FE tách riêng)
        value: "https://REPLACE_WITH_API_HOST/api/v1"

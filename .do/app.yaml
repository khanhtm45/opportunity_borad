# DigitalOcean — BE + FE cùng main
#
# QUAN TRỌNG trên UI (component FE):
# - Type = Web Service (Docker), KHÔNG phải Static Site / Node
# - Source Directory = frontend
# - Dockerfile path = Dockerfile   ← relative to source_dir (đừng ghi frontend/Dockerfile)
# - HTTP Port = 8080
# - Run Command = (để trống — dùng ENTRYPOINT image) hoặc:
#     /docker-entrypoint-ob.sh
# - Env BUILD_TIME: VITE_BASE_PATH=/  và VITE_API_URL=https://<api-host>/api/v1

name: opportunity-board
region: sgp

services:
  - name: api
    github:
      repo: khanhtm45/opportunity_borad
      branch: main
      deploy_on_push: true
    source_dir: backend
    dockerfile_path: Dockerfile
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    run_command: java -jar app.jar
    routes:
      - path: /api
    health_check:
      http_path: /api/v1/categories
      initial_delay_seconds: 90
      period_seconds: 20
      timeout_seconds: 10
      success_threshold: 1
      failure_threshold: 10
    envs:
      - key: PORT
        scope: RUN_TIME
        value: "8080"
      - key: DB_PASSWORD
        scope: RUN_TIME
        type: SECRET
        value: SET_IN_DIGITALOCEAN_UI
      - key: JWT_SECRET
        scope: RUN_TIME
        type: SECRET
        value: CHANGE_ME_SET_IN_DO_UI_32chars_min!!

  - name: frontend
    github:
      repo: khanhtm45/opportunity_borad
      branch: main
      deploy_on_push: true
    source_dir: frontend
    dockerfile_path: Dockerfile
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    run_command: /docker-entrypoint-ob.sh
    routes:
      - path: /
    envs:
      - key: PORT
        scope: RUN_TIME
        value: "8080"
      - key: VITE_BASE_PATH
        scope: BUILD_TIME
        value: "/"
      - key: VITE_API_URL
        scope: BUILD_TIME
        value: "https://REPLACE_WITH_API_HOST/api/v1"

# DigitalOcean App — FRONTEND ONLY
# Custom domain: https://ob.khanhtn45.id.vn
# DO default:     https://shark-app-epimy.ondigitalocean.app
# API (proxy):    https://oyster-app-eleoo.ondigitalocean.app
#
# UI checklist:
# - Web Service (Docker), source = frontend, Dockerfile = Dockerfile
# - HTTP Port 8080, Route /, Run = /docker-entrypoint-ob.sh
# - BUILD_TIME: VITE_BASE_PATH=/ ; VITE_API_URL để TRỐNG (dùng /api/v1 same-origin)
#   → nginx proxy /api → API_PROXY_HOST (tránh 405 trên FE)
# - RUN_TIME: API_PROXY_HOST=oyster-app-eleoo.ondigitalocean.app
# - Xóa VITE_BASE_PATH nếu từng = URL API; Force Rebuild sau khi đổi

name: opportunity-board-frontend
region: sgp

services:
  - name: frontend
    github:
      repo: khanhtm45/opportunity_borad
      branch: main
      deploy_on_push: true
    source_dir: frontend
    dockerfile_path: Dockerfile
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    run_command: /docker-entrypoint-ob.sh
    routes:
      - path: /
    envs:
      - key: PORT
        scope: RUN_TIME
        value: "8080"
      - key: API_PROXY_HOST
        scope: RUN_TIME
        value: "oyster-app-eleoo.ondigitalocean.app"
      - key: VITE_BASE_PATH
        scope: BUILD_TIME
        value: "/"
      # Empty → browser calls https://ob.khanhtn45.id.vn/api/v1 → nginx → oyster
      - key: VITE_API_URL
        scope: BUILD_TIME
        value: ""
